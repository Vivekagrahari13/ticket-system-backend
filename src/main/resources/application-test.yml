spring:
  application:
    name: ticket-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_system}
    username: ${DB_USER:postgres}
#    password: ${DB_PASSWORD}
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

logging:
  level:
    root: INFO
    com.ticket.system: ${LOG_LEVEL:INFO}
#    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [req=%X{requestId:-}] [user=%X{userId:-}] %logger{30} - %msg%n"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-minutes: 60
  cookie-secure: ${COOKIE_SECURE:false}
  admin-email: ${ADMIN_EMAIL}
  admin-password: ${ADMIN_PASSWORD}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}